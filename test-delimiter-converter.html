<!DOCTYPE html>
<html>
<head>
    <title>Delimiter Converter Test Suite</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .pass { border-color: #4CAF50; background: #f8fff8; }
        .fail { border-color: #f44336; background: #fff8f8; }
        .input, .expected, .actual { 
            background: #f5f5f5; 
            padding: 10px; 
            margin: 5px 0; 
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Delimiter Converter Test Suite</h1>
    <div id="results"></div>

    <script>
        // Test data
        const tests = [
            {
                name: "CSV to TSV - Basic",
                input: "Name,Age,City\nJohn,30,New York\nJane,25,London",
                inputDelimiter: ",",
                outputDelimiter: "\t",
                expected: "Name\tAge\tCity\nJohn\t30\tNew York\nJane\t25\tLondon"
            },
            {
                name: "CSV with Quotes - Comma in Value",
                input: 'Name,Description\nJohn,"Software Engineer, Senior"\nJane,"Product Manager"',
                inputDelimiter: ",",
                outputDelimiter: "|",
                expected: 'Name|Description\nJohn|Software Engineer, Senior\nJane|Product Manager'
            },
            {
                name: "TSV to CSV",
                input: "Product\tPrice\tStock\nLaptop\t999.99\t50\nMouse\t29.99\t100",
                inputDelimiter: "\t",
                outputDelimiter: ",",
                expected: "Product,Price,Stock\nLaptop,999.99,50\nMouse,29.99,100"
            },
            {
                name: "Pipe to Semicolon",
                input: "ID|Name|Email\n1|John Doe|john@example.com\n2|Jane Smith|jane@example.com",
                inputDelimiter: "|",
                outputDelimiter: ";",
                expected: "ID;Name;Email\n1;John Doe;john@example.com\n2;Jane Smith;jane@example.com"
            },
            {
                name: "Custom Delimiter (Hash to Colon)",
                input: "Field1#Field2#Field3\nValue1#Value2#Value3\nTest1#Test2#Test3",
                inputDelimiter: "#",
                outputDelimiter: ":",
                expected: "Field1:Field2:Field3\nValue1:Value2:Value3\nTest1:Test2:Test3"
            },
            {
                name: "Complex CSV with Multiple Quotes",
                input: 'Company,Address,Description\n"ACME Corp","123 Main St, Suite 100","Software ""Solutions"" Provider"\n"Tech Inc","456 Oak Ave","Hardware & Software"',
                inputDelimiter: ",",
                outputDelimiter: "\t",
                expected: 'Company\tAddress\tDescription\nACME Corp\t123 Main St, Suite 100\tSoftware "Solutions" Provider\nTech Inc\t456 Oak Ave\tHardware & Software'
            }
        ];

        // Copy the parsing functions from the component
        function parseCSV(text, delimiter, preserveQuotes = true) {
            if (!text.trim()) return [];
            
            const rows = [];
            const lines = text.split('\n');
            
            for (const line of lines) {
                if (!line.trim()) continue;
                
                const row = [];
                let current = '';
                let inQuotes = false;
                let i = 0;
                
                while (i < line.length) {
                    const char = line[i];
                    
                    if (char === '"' && preserveQuotes) {
                        if (inQuotes && line[i + 1] === '"') {
                            current += '"';
                            i += 2;
                            continue;
                        }
                        inQuotes = !inQuotes;
                        i++;
                        continue;
                    }
                    
                    if (!inQuotes && line.substring(i, i + delimiter.length) === delimiter) {
                        row.push(current.trim());
                        current = '';
                        i += delimiter.length;
                        continue;
                    }
                    
                    current += char;
                    i++;
                }
                
                row.push(current.trim());
                rows.push(row);
            }
            
            return rows;
        }

        function formatCSV(rows, delimiter, preserveQuotes = true) {
            return rows.map(row => {
                return row.map(cell => {
                    const needsQuoting = preserveQuotes && (
                        cell.includes(delimiter) || 
                        cell.includes('"') || 
                        cell.includes('\n') ||
                        cell.includes('\r')
                    );
                    
                    if (needsQuoting) {
                        return `"${cell.replace(/"/g, '""')}"`;
                    }
                    
                    return cell;
                }).join(delimiter);
            }).join('\n');
        }

        function convertDelimiters(input, inputDelimiter, outputDelimiter) {
            const rows = parseCSV(input, inputDelimiter);
            return formatCSV(rows, outputDelimiter);
        }

        // Run tests
        function runTests() {
            const resultsDiv = document.getElementById('results');
            let passCount = 0;
            let totalCount = tests.length;

            tests.forEach((test, index) => {
                const testDiv = document.createElement('div');
                testDiv.className = 'test';
                
                try {
                    const actual = convertDelimiters(test.input, test.inputDelimiter, test.outputDelimiter);
                    const passed = actual === test.expected;
                    
                    if (passed) {
                        passCount++;
                        testDiv.classList.add('pass');
                    } else {
                        testDiv.classList.add('fail');
                    }
                    
                    testDiv.innerHTML = `
                        <h3>Test ${index + 1}: ${test.name} - ${passed ? 'PASS' : 'FAIL'}</h3>
                        <div><strong>Input Delimiter:</strong> "${test.inputDelimiter === '\t' ? '\\t' : test.inputDelimiter}"</div>
                        <div><strong>Output Delimiter:</strong> "${test.outputDelimiter === '\t' ? '\\t' : test.outputDelimiter}"</div>
                        <div><strong>Input:</strong></div>
                        <div class="input">${test.input}</div>
                        <div><strong>Expected:</strong></div>
                        <div class="expected">${test.expected}</div>
                        <div><strong>Actual:</strong></div>
                        <div class="actual">${actual}</div>
                    `;
                } catch (error) {
                    testDiv.classList.add('fail');
                    testDiv.innerHTML = `
                        <h3>Test ${index + 1}: ${test.name} - ERROR</h3>
                        <div class="actual">Error: ${error.message}</div>
                    `;
                }
                
                resultsDiv.appendChild(testDiv);
            });

            // Summary
            const summary = document.createElement('div');
            summary.innerHTML = `
                <h2>Test Summary</h2>
                <p><strong>${passCount}/${totalCount}</strong> tests passed</p>
                <p>Success Rate: <strong>${Math.round((passCount/totalCount) * 100)}%</strong></p>
            `;
            summary.style.cssText = `
                background: ${passCount === totalCount ? '#4CAF50' : '#ff9800'}; 
                color: white; 
                padding: 15px; 
                margin: 20px 0; 
                border-radius: 5px;
            `;
            resultsDiv.insertBefore(summary, resultsDiv.firstChild);
        }

        // Run tests when page loads
        window.onload = runTests;
    </script>
</body>
</html>
